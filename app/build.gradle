plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ai.opencode.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "ai.opencode.mobile"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.0"

        // API key from gradle.properties or environment variable
        // NEVER hardcode API keys here — use ~/.gradle/gradle.properties
        buildConfigField "String", "OPENCODE_API_KEY", "\"${System.getenv('OPENCODE_API_KEY') ?: project.findProperty('OPENCODE_API_KEY') ?: ''}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            // Debug API key from gradle.properties or env
            buildConfigField "String", "OPENCODE_API_KEY", "\"${System.getenv('OPENCODE_API_KEY') ?: project.findProperty('OPENCODE_API_KEY') ?: ''}\""
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'org.java-websocket:Java-WebSocket:1.5.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.json:json:20231013'

    // Encrypted SharedPreferences for secure credential storage
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
