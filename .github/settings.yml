# GitHub Settings Probot configuration
# Triggers probot/settings for automated repo configuration
repository:
  has_issues: true
  has_projects: true
  has_wiki: true
  has_downloads: true
  has_pages: false
  default_branch: main
  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: true
  delete_branch_on_merge: true
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true

labels:
  - name: good first issue
    color: 7057ff
    description: Good for newcomers
  - name: help wanted
    color: 008672
    description: Extra attention is needed
  - name: bug
    color: d73a4a
    description: Something isn't working
  - name: enhancement
    color: a2eeef
    description: New feature or request
  - name: documentation
    color: 0075ca
    description: Improvements or additions to documentation
  - name: contributions-welcome
    color: 16e2e2
    description: We welcome contributions on this issue
  - name: hacktoberfest
    color: fb611e
    description: Hacktoberfest participation
  - name: beginner-friendly
    color: bfd4f2
    description: Beginner friendly issue
  - name: priority:high
    color: ff0000
    description: High priority
  - name: auto-merge
    color: 0e8a16
    description: Auto-merge enabled
