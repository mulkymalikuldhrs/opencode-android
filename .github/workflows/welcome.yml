name: Welcome New Contributor
on:
  pull_request:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            const { data: prs } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:pr author:${author}`,
              per_page: 1
            });
            if (prs.total_count <= 1) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `👋 Welcome @${author}! Thank you for your first contribution to this project! We appreciate your help and are here if you need anything. Please check out our [CONTRIBUTING.md](./CONTRIBUTING.md) for guidelines.`
              });
            }
